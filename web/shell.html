<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labirent — Veri Yapıları Oyunu</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; background: #1e1e1e; color: #ddd; font-family: system-ui, sans-serif; }
    main { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; }
    /* Canvas oyunun kendi cozunurlugunde cizer (menu 800x600, oyunda labirente gore);
       burada en-boy oranini koruyarak ekrana sigdiriyoruz. Dokunma ve fare koordinatlari
       raylib/emscripten tarafinda canvas'in ekrandaki boyutuna gore cevriliyor.
       Canvas'a border/padding VERMEYIN: koordinat cevirisi bozulur. */
    canvas { display: block; outline: none; background: #000;
      width: auto; height: auto; max-width: 100%;
      max-height: calc(100vh - 56px); max-height: calc(100dvh - 56px);
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; }
    .telefon-ipucu { display: none; }
    @media (pointer: coarse) { .telefon-ipucu { display: block; } }
    @media (max-width: 600px), (max-height: 500px) {
      main { padding: 8px; gap: 8px; }
    }
    /* Yatay telefon: yukseklik az, canvas neredeyse tum ekrani kullanir */
    @media (max-height: 500px) {
      canvas { max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px); }
    }
    #durum { font-size: 14px; color: #aaa; }
    p { margin: 0; font-size: 14px; color: #999; text-align: center; }
    kbd { background: #333; border-radius: 4px; padding: 1px 6px; color: #eee; }
  </style>
</head>
<body>
  <main>
    <div id="durum">Yükleniyor…</div>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <p class="telefon-ipucu">Telefonda: yatay tutarsan labirent daha büyük görünür; 20×12 gibi küçük bir boyut seç.</p>
    <p>Hareket: <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> · İpucu: <kbd>H</kbd> · Geri al: <kbd>Z</kbd></p>
    <p>Klavye ve fare gerekir. Skorlar sayfa yenilenince sıfırlanır.</p>
  </main>
  <script>
    var canvas = document.getElementById('canvas');
    var Module = {
      canvas: canvas,
      setStatus: function (t) { document.getElementById('durum').textContent = t || ''; },
      onRuntimeInitialized: function () { canvas.focus(); }
    };

    // Tiklama sayaclari (giris.c her karede okur). Fare, dokunma ve kalem ayni yoldan gelir.
    // - Sayac: bas+birak iki kare arasina sigsa da (RustDesk, hizli dokunus) tiklama kaybolmaz.
    // - Konum olay aninda canvas pikseline cevrilir; sonradan fare konumuna guvenilmez.
    // - Sadece pointer olaylari dinlenir: tarayicinin dokunmadan sonra urettigi sahte
    //   mousedown/mouseup/click olaylari pointer olayi degildir, dokunus iki kez sayilmaz.
    Module.tiklama = { basma: 0, birakma: 0, basmaX: -1, basmaY: -1, birakmaX: -1, birakmaY: -1 };
    function canvasKonumu(e) {
      var r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * canvas.width / r.width,
               y: (e.clientY - r.top) * canvas.height / r.height };
    }
    canvas.addEventListener('pointerdown', function (e) {
      canvas.focus();
      if (!e.isPrimary || e.button !== 0) return; // ikinci parmak, sag/orta tus sayilmaz
      var k = canvasKonumu(e), t = Module.tiklama;
      t.basmaX = k.x; t.basmaY = k.y; t.basma++;
    });
    canvas.addEventListener('pointerup', function (e) {
      if (!e.isPrimary || e.button !== 0) return;
      var k = canvasKonumu(e), t = Module.tiklama;
      t.birakmaX = k.x; t.birakmaY = k.y; t.birakma++;
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
