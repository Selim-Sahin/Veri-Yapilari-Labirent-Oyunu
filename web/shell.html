<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labirent — Veri Yapıları Oyunu</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; background: #1e1e1e; color: #ddd; font-family: system-ui, sans-serif; }
    main { position: relative; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; }
    /* Canvas oyunun kendi cozunurlugunde cizer (menu 800x600, oyunda labirente gore);
       burada en-boy oranini koruyarak ekrana sigdiriyoruz. Dokunma ve fare koordinatlari
       raylib/emscripten tarafinda canvas'in ekrandaki boyutuna gore cevriliyor.
       Canvas'a border/padding VERMEYIN: koordinat cevirisi bozulur. */
    canvas { display: block; outline: none; background: #000;
      width: auto; height: auto; max-width: 100%;
      max-height: calc(100vh - 56px); max-height: calc(100dvh - 56px);
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; }
    .telefon-ipucu { display: none; }
    @media (pointer: coarse) { .telefon-ipucu { display: block; } }
    @media (max-width: 600px), (max-height: 500px) {
      main { padding: 8px; gap: 8px; }
    }
    /* Yatay telefon: yukseklik az, canvas neredeyse tum ekrani kullanir */
    @media (max-height: 500px) {
      canvas { max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px); }
    }
    #durum { font-size: 14px; color: #aaa; }
    #durum:empty { display: none; }
    /* Yazi kutulari: canvas'taki kutunun tam ustunde duran, gorunmez gercek <input>'lar.
       Kutuyu ve yaziyi oyun (C) cizer; input sadece telefonda klavyeyi acmak ve yaziyi
       tasimak icin var. font-size 16px: iOS odaklaninca sayfayi yakinlastirmasin. */
    input.kutu { position: absolute; display: none; box-sizing: border-box; margin: 0; padding: 0;
      border: 0; border-radius: 0; outline: none; background: transparent; color: transparent;
      caret-color: transparent; font-size: 16px; -webkit-appearance: none; appearance: none;
      -webkit-tap-highlight-color: transparent; }
    input.kutu::selection { background: transparent; }

    /* Dokunmatik oyun kontrolleri: yalnizca telefonda/tablette ve oyun ekranindayken
       (C, oyuna girerken body'ye 'oyunda' ekler). Labirentin ustunu kapatmaz:
       dikeyde altinda, yatayda iki yaninda (solda eylemler, sagda yon tuslari). */
    #kontroller { display: none; }
    #kontroller button { font: 600 15px system-ui, sans-serif; color: #fff; background: #2c3e50;
      border: 0; border-radius: 10px; padding: 0; min-height: 44px; min-width: 44px;
      touch-action: manipulation; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #kontroller button:active, #kontroller button.basili { background: #1e6fe0; }
    #kontroller button.onay { background: #c0392b; }
    .yon-tuslari { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px);
      gap: 0; grid-template-areas: ". u ." "l . r" ". d ."; }
    .yon-tuslari button { font-size: 24px !important; }
    .yon-tuslari .yukari { grid-area: u; } .yon-tuslari .asagi { grid-area: d; }
    .yon-tuslari .sol { grid-area: l; } .yon-tuslari .sag { grid-area: r; }
    .eylemler { display: flex; flex-direction: column; gap: 8px; }
    .eylemler button { width: 120px; height: 52px; }
    @media (pointer: coarse) {
      body.oyunda .telefon-ipucu { display: none; }
      body.oyunda #kontroller { display: flex; gap: 20px; align-items: center; justify-content: center; }
      /* Dikey: panel (180px) labirentin altinda */
      body.oyunda canvas { max-height: calc(100vh - 16px - 180px - 8px); max-height: calc(100dvh - 16px - 180px - 8px); }
    }
    @media (pointer: coarse) and (orientation: landscape) {
      body.oyunda main { flex-direction: row; justify-content: center; }
      body.oyunda #kontroller { display: contents; }
      body.oyunda .eylemler { order: -1; width: 110px; }
      body.oyunda .eylemler button { width: 110px; height: 48px; }
      body.oyunda .yon-tuslari { order: 1; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); }
      body.oyunda canvas { max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px);
        max-width: calc(100vw - 16px - 110px - 168px - 16px); }
    }
    p { margin: 0; font-size: 14px; color: #999; text-align: center; }
    kbd { background: #333; border-radius: 4px; padding: 1px 6px; color: #eee; }
  </style>
</head>
<body>
  <main>
    <div id="durum">Yükleniyor…</div>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <!-- Sira giris.h'deki YaziKutusu ile ayni olmali -->
    <input class="kutu" aria-label="Labirent genişliği" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" enterkeyhint="done">
    <input class="kutu" aria-label="Labirent yüksekliği" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" enterkeyhint="done">
    <input class="kutu" data-tur="isim" aria-label="İsim" maxlength="15" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <input class="kutu" aria-label="Skor tablosunda ara" maxlength="20" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <div id="kontroller">
      <div class="yon-tuslari">
        <button type="button" class="yukari" data-komut="1" aria-label="Yukarı">▲</button>
        <button type="button" class="sol" data-komut="3" aria-label="Sol">◀</button>
        <button type="button" class="sag" data-komut="4" aria-label="Sağ">▶</button>
        <button type="button" class="asagi" data-komut="2" aria-label="Aşağı">▼</button>
      </div>
      <div class="eylemler">
        <button type="button" data-komut="5">İPUCU</button>
        <button type="button" data-komut="6">GERİ AL</button>
        <button type="button" data-komut="7" id="menu-dugmesi">MENÜ</button>
      </div>
    </div>
    <p class="telefon-ipucu">Telefonda labirent en fazla 20×20 olabilir. Oyunda yön tuşlarına bas ya da labirentin üstünde parmağını kaydır.</p>
  </main>
  <script>
    var canvas = document.getElementById('canvas');
    var Module = {
      canvas: canvas,
      setStatus: function (t) { document.getElementById('durum').textContent = t || ''; },
      onRuntimeInitialized: function () { canvas.focus(); }
    };

    // Tiklama sayaclari (giris.c her karede okur). Fare, dokunma ve kalem ayni yoldan gelir.
    // - Sayac: bas+birak iki kare arasina sigsa da (RustDesk, hizli dokunus) tiklama kaybolmaz.
    // - Konum olay aninda canvas pikseline cevrilir; sonradan fare konumuna guvenilmez.
    // - Sadece pointer olaylari dinlenir: tarayicinin dokunmadan sonra urettigi sahte
    //   mousedown/mouseup/click olaylari pointer olayi degildir, dokunus iki kez sayilmaz.
    Module.tiklama = { basma: 0, birakma: 0, basmaX: -1, basmaY: -1, birakmaX: -1, birakmaY: -1 };
    function canvasKonumu(e) {
      var r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * canvas.width / r.width,
               y: (e.clientY - r.top) * canvas.height / r.height };
    }
    // Oyun komutlari (giris.c: oyun_komutu karede birini alir). Sayilar giris.h'deki OyunKomutu.
    Module.komutlar = [];
    function komutEkle(k) { if (Module.komutlar.length < 8) Module.komutlar.push(k); }
    document.querySelectorAll('#kontroller button').forEach(function (b) {
      var k = +b.getAttribute('data-komut');
      // click degil pointerdown: gecikme yok; preventDefault cift dokunma yakinlastirmasini,
      // odak kaymasini ve dokunmadan sonra uretilen sahte fare olaylarini engeller.
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        b.classList.add('basili');
        komutEkle(k);
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) {
        b.addEventListener(t, function () { b.classList.remove('basili'); });
      });
      b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    });

    // Parmakla kaydirma: oyundayken labirentin ustunde, en az 24 CSS px; baskin eksen yonu
    // belirler, bir kaydirma bir adim. Fare ile surukleme sayilmaz (bilgisayar ayni kalsin).
    var kaydirma = null;
    canvas.addEventListener('pointerdown', function (e) {
      kaydirma = (e.isPrimary && e.pointerType !== 'mouse' && document.body.classList.contains('oyunda'))
        ? { x: e.clientX, y: e.clientY } : null;
    });
    canvas.addEventListener('pointerup', function (e) {
      if (!kaydirma || !e.isPrimary) return;
      var dx = e.clientX - kaydirma.x, dy = e.clientY - kaydirma.y;
      kaydirma = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; // kisa dokunus hareket degil
      if (Math.abs(dx) > Math.abs(dy)) komutEkle(dx > 0 ? 4 : 3);
      else komutEkle(dy > 0 ? 2 : 1);
    });
    canvas.addEventListener('pointercancel', function () { kaydirma = null; });

    canvas.addEventListener('pointerdown', function (e) {
      canvas.focus();
      if (!e.isPrimary || e.button !== 0) return; // ikinci parmak, sag/orta tus sayilmaz
      var k = canvasKonumu(e), t = Module.tiklama;
      t.basmaX = k.x; t.basmaY = k.y; t.basma++;
    });
    canvas.addEventListener('pointerup', function (e) {
      if (!e.isPrimary || e.button !== 0) return;
      var k = canvasKonumu(e), t = Module.tiklama;
      t.birakmaX = k.x; t.birakmaY = k.y; t.birakma++;
    });

    // Yazi kutulari (giris.c: yazi_kutusu). C her karede gorunen kutuyu kaydeder; input
    // canvas'taki kutunun ustune oturur. Telefonda klavye yalnizca kullanicinin dokunusu
    // bir <input>'a geldiginde acilir: dokunus dogrudan input'a dustugu icin tarayici onu
    // kendisi odaklar; ayrica ayni olayin icinde focus() da cagiriyoruz.
    var kutular = Array.prototype.slice.call(document.querySelectorAll('input.kutu'));
    var anaAlan = document.querySelector('main');
    kutular.forEach(function (el) {
      el._kirli = false; el._enter = false; el._kare = 0;
      function odakla() { if (document.activeElement !== el) el.focus(); }
      el.addEventListener('pointerdown', odakla);
      el.addEventListener('click', odakla);
      el.addEventListener('input', function () {
        // Isim: raylib fontu Turkce harf cizemez, Firestore kurali da yalnizca a-z/0-9 ister.
        // Turkce harfleri karsiligina cevir (Selin Şahin -> Selin Sahin); gerisini C suzer.
        if (el.dataset.tur === 'isim') {
          var tr = { 'ç':'c','Ç':'C','ğ':'g','Ğ':'G','ı':'i','İ':'I','ö':'o','Ö':'O','ş':'s','Ş':'S','ü':'u','Ü':'U' };
          var ascii = el.value.replace(/[çÇğĞıİöÖşŞüÜ]/g, function (h) { return tr[h]; });
          if (ascii !== el.value) el.value = ascii;
        }
        // Sayi kutusunda rakam disini hemen at: C bir sonraki karede suzene kadar maxlength
        // dolup sonraki rakami engellemesin
        if (el.inputMode === 'numeric') {
          var temiz = el.value.replace(/[^0-9]/g, '');
          if (temiz !== el.value) el.value = temiz;
        }
        el._kirli = true;
      });
    });
    // Yazi kutusundaki tuslar oyuna gitmesin. raylib (emscripten GLFW) klavyeyi window'da
    // YAKALAMA asamasinda dinliyor; input'ta stopPropagation cok gec kalir: harf iki kez
    // yazilir, GLFW Backspace'i de engeller. Bu dinleyici index.js'den once kaydedildigi
    // icin once calisir; stopImmediatePropagation GLFW'yi atlatir, tarayicinin yazma
    // davranisi (preventDefault yok) aynen surer.
    ['keydown', 'keypress', 'keyup'].forEach(function (tur) {
      window.addEventListener(tur, function (e) {
        var el = e.target;
        if (kutular.indexOf(el) < 0) return;
        e.stopImmediatePropagation();
        if (tur === 'keydown' && e.key === 'Enter') {
          e.preventDefault();
          el._enter = true; el.blur(); canvas.focus();
        }
      }, true);
    });
    Module.kutuYerlestir = function (i, x, y, w, h, kare) {
      var el = kutular[i], c = canvas.getBoundingClientRect(), a = anaAlan.getBoundingClientRect();
      var o = c.width / canvas.width;
      el.style.left = (c.left - a.left + x * o) + 'px';
      el.style.top = (c.top - a.top + y * o) + 'px';
      el.style.width = (w * o) + 'px';
      el.style.height = (h * o) + 'px';
      el._kare = kare;
      if (el.style.display !== 'block') el.style.display = 'block';
    };
    Module.kutulariGizle = function (kare) {
      kutular.forEach(function (el) {
        if (el.style.display === 'block' && el._kare < kare - 1) {
          if (document.activeElement === el) { el.blur(); canvas.focus(); }
          el.style.display = 'none';
          el._kirli = false; el._enter = false;
        }
      });
    };
    // Yazildiysa yeni deger, yazilmadiysa null
    Module.kutuOku = function (i) {
      var el = kutular[i];
      if (!el._kirli) return null;
      el._kirli = false;
      return el.value;
    };
    Module.kutuYaz = function (i, s) { var el = kutular[i]; if (el.value !== s) el.value = s; };
    Module.kutuOdakta = function (i) { return document.activeElement === kutular[i] ? 1 : 0; };
    Module.kutuEnter = function (i) { var el = kutular[i], e = el._enter; el._enter = false; return e ? 1 : 0; };

    // --- Ortak skor tablosu (Firebase Firestore) ---
    // C (skor_depo.c) islemi baslatir ve her karede durumu okur; burada asla beklenmez.
    // Durum kodlari skor_depo.h'deki DepoDurumu ile ayni: -1 bosta, 0 bekliyor, 1 tamam,
    // 2 isim alinmis, 3 baglanti/sunucu hatasi. Firebase asagidaki modul script'inde yuklenir.
    Module.kayitDurumu = -1;
    Module.tabloDurumu = -1;
    Module.tabloSurumu = 0;   // her basarili yuklemede artar; C yeni tabloyu buradan anlar
    Module.skorTablosu = [];
    var firebaseHazir = new Promise(function (coz, reddet) {
      Module.firebaseCoz = coz; Module.firebaseReddet = reddet;
    });
    // Internet yoksa ya da Firebase yuklenemezse oyun sonsuza kadar beklemesin
    function zamanAsimi(soz, ms) {
      return Promise.race([soz, new Promise(function (_, reddet) {
        setTimeout(function () { reddet(new Error('zaman asimi')); }, ms);
      })]);
    }
    Module.skorKaydet = function (isim, puan, genislik, yukseklik) {
      Module.kayitDurumu = 0;
      zamanAsimi(firebaseHazir.then(function (fb) { return fb.kaydet(isim, puan, genislik, yukseklik); }), 15000)
        .then(function (sonuc) { Module.kayitDurumu = sonuc; })
        .catch(function (e) { console.error('Skor kaydedilemedi:', e); Module.kayitDurumu = 3; });
    };
    var sonYukleme = 0; // ust uste YENILE'de yalnizca en son istegin cevabi kullanilir
    Module.skorlariYukle = function () {
      var no = ++sonYukleme;
      Module.tabloDurumu = 0;
      zamanAsimi(firebaseHazir.then(function (fb) { return fb.yukle(); }), 15000)
        .then(function (liste) {
          if (no !== sonYukleme) return;
          Module.skorTablosu = liste; Module.tabloSurumu++; Module.tabloDurumu = 1;
        })
        .catch(function (e) {
          if (no !== sonYukleme) return;
          console.error('Skor tablosu yuklenemedi:', e); Module.tabloDurumu = 3;
        });
    };
  </script>
  <script type="module">
    // Firestore Lite: tek seferlik okuma/yazma icin kucuk surum (canli dinleme yok, gerek de yok).
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
    import { getFirestore, doc, collection, query, orderBy, limit, getDocs, runTransaction, serverTimestamp }
      from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore-lite.js';

    // Bu ayarlar gizli degil: Firebase'in herkese acik proje kimligi. Guvenligi Firestore
    // kurallari saglar (okuma + yeni kayit serbest; degistirme ve silme herkese kapali).
    const firebaseConfig = {
      apiKey: 'AIzaSyDWY1Kvxwxcu0AkDwnFobvAd2vUslkxS70',
      authDomain: 'labirent-skor.firebaseapp.com',
      projectId: 'labirent-skor',
      storageBucket: 'labirent-skor.firebasestorage.app',
      messagingSenderId: '408987233965',
      appId: '1:408987233965:web:b86a019881dd02908e6024'
    };

    try {
      const db = getFirestore(initializeApp(firebaseConfig));
      const ALINMIS = 'isim-alinmis';
      Module.firebaseCoz({
        // Belge kimligi = ismin kucuk harfli hali: "Selim" ve "SELIM" ayni belgedir.
        // Once okuyup varsa "alinmis" deriz; yoksa olustururuz. Iki kisi ayni anda ayni
        // ismi denerse kurallar ikincisinin yazmasini (guncelleme sayildigi icin) reddeder.
        kaydet: async function (isim, puan, genislik, yukseklik) {
          const belge = doc(db, 'skorlar', isim.toLowerCase());
          try {
            await runTransaction(db, async function (islem) {
              const mevcut = await islem.get(belge);
              if (mevcut.exists()) throw ALINMIS;
              islem.set(belge, { isim: isim, puan: puan, genislik: genislik, yukseklik: yukseklik,
                                 tarih: serverTimestamp() });
            });
            return 1;
          } catch (e) {
            if (e === ALINMIS) return 2;
            throw e;
          }
        },
        // Puana gore en yuksek 200 kayit (her kayit bir "okuma" sayilir; ucretsiz kota gunde 50.000)
        yukle: async function () {
          const sonuc = await getDocs(query(collection(db, 'skorlar'), orderBy('puan', 'desc'), limit(200)));
          return sonuc.docs.map(function (b) {
            const v = b.data();
            return { isim: String(v.isim || ''), puan: v.puan | 0, genislik: v.genislik | 0, yukseklik: v.yukseklik | 0 };
          });
        }
      });
    } catch (e) {
      console.error('Firebase baslatilamadi:', e);
      Module.firebaseReddet(e);
    }
  </script>
  {{{ SCRIPT }}}
</body>
</html>
