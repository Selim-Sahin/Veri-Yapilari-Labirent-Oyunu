# Oyunu Emscripten ile WebAssembly'ye derler ve GitHub Pages'te yayinlar.
# main dalina her push'ta kendiliginden calisir; Actions sekmesinden elle de baslatilabilir.
name: Web surumunu yayinla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Emscripten kur
        uses: mymindstorm/setup-emsdk@v14

      - name: Web icin derle
        run: |
          emcmake cmake -B build-web -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release -Wno-dev
          cmake --build build-web -j4

      - name: Yayinlanacak dosyalari topla
        run: |
          mkdir -p _site
          cp build-web/index.html build-web/index.js build-web/index.wasm build-web/favicon.svg build-web/apple-touch-icon.png _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
